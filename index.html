<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DavidSchool</title>

<style>
body{margin:0;font-family:Arial;background:#f2f2f2}
header{background:linear-gradient(90deg,#1e90ff,#6a00ff);color:white;padding:20px;text-align:center;position:relative}
#adminIcon{position:absolute;top:15px;left:15px;width:40px;height:40px;background:white;color:#6a00ff;
border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;cursor:pointer}
main{padding:20px}
.card{background:white;padding:15px;margin:10px;border-radius:10px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.grid{display:flex;flex-wrap:wrap}
.exercise{width:200px;margin:10px;padding:10px;border-radius:10px;color:white;position:relative}
.exercise img{width:100%;border-radius:10px;cursor:pointer}
.delete{position:absolute;top:5px;right:5px;background:red;color:white;border:none;border-radius:5px;cursor:pointer}
button{padding:10px;border:none;border-radius:8px;background:#6a00ff;color:white;cursor:pointer}
select,input{width:100%;padding:10px;margin:5px 0}

#adminModal,#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;
background:rgba(0,0,0,.6);justify-content:center;align-items:center;z-index:1000}
#adminBox{background:white;padding:20px;border-radius:15px;width:90%;max-width:400px;max-height:90%;overflow:auto;position:relative}
#closeAdmin{position:absolute;top:10px;right:15px;cursor:pointer;font-size:20px}
#overlay img{max-width:90%;max-height:90%;border-radius:10px}
</style>
</head>

<body>

<header>
<h1>DavidSchool</h1>
<div id="adminIcon">⚙</div>
</header>

<main>
<div id="classes" class="grid"></div>
<div id="subjects" class="grid" style="display:none"></div>
<div id="exercises" class="grid" style="display:none"></div>
<button id="backBtn" style="display:none" onclick="goBack()">Retour</button>
</main>

<!-- ADMIN -->
<div id="adminModal">
<div id="adminBox">
<span id="closeAdmin">✖</span>
<h2>Admin</h2>

<input type="password" id="loginPass" placeholder="Code admin">
<button onclick="login()">Connexion</button>

<div id="adminPanel" style="display:none">
<hr>
<label>Nouveau code admin</label>
<input id="newPass" value="1234">
<button onclick="changePass()">Changer</button>

<hr>
<select id="aClass"></select>
<select id="aSubject"></select>
<input id="aTitle" placeholder="Titre">
<input type="file" id="aFile" accept="image/*,.pdf,.doc,.docx">
<button onclick="addExercise()">Ajouter</button>
</div>

</div>
</div>

<div id="overlay" onclick="this.style.display='none'">
<img id="overlayImg">
</div>

<script>
let adminPass = localStorage.getItem("ds_pass") || "1234";
let exercises = JSON.parse(localStorage.getItem("ds_exercises")) || [];

const classes = {
"6e":["Français","Math","Anglais","Histoire","Géographie"],
"5e":["Français","Math","Anglais","Histoire","Géographie"],
"4e":["Français","Math","Anglais","Physique","Chimie","Histoire"],
"3e":["Français","Math","Anglais","Physique","Chimie","Histoire","Géographie"]
};

const colors={
Math:"#1abc9c",Français:"#e74c3c",Anglais:"#3498db",
Physique:"#9b59b6",Chimie:"#f39c12",Histoire:"#2ecc71",Géographie:"#16a085"
};

let curClass="",curSubject="",isAdmin=false;

function save(){localStorage.setItem("ds_exercises",JSON.stringify(exercises))}

function loadClasses(){
const box=document.getElementById("classes");
box.innerHTML="";
for(let c in classes){
let d=document.createElement("div");
d.className="card";d.innerText=c.toUpperCase();
d.onclick=()=>{curClass=c;loadSubjects()};
box.appendChild(d);
}
}

function loadSubjects(){
document.getElementById("classes").style.display="none";
const box=document.getElementById("subjects");
box.style.display="flex";box.innerHTML="";
classes[curClass].forEach(s=>{
let d=document.createElement("div");
d.className="card";d.innerText=s;
d.onclick=()=>{curSubject=s;loadExercises()};
box.appendChild(d);
});
document.getElementById("backBtn").style.display="block";
}

function loadExercises(){
document.getElementById("subjects").style.display="none";
const box=document.getElementById("exercises");
box.style.display="flex";box.innerHTML="";
exercises.filter(e=>e.c==curClass && e.s==curSubject).forEach((e,i)=>{
let d=document.createElement("div");
d.className="exercise";d.style.background=colors[e.s];
d.innerHTML=`<b>${e.t}</b><br>`;
if(e.type=="img"){
let img=document.createElement("img");
img.src=e.data;img.onclick=()=>{overlayImg.src=e.data;overlay.style.display="flex"};
d.appendChild(img);
}else{
let a=document.createElement("a");
a.href=e.data;a.download=e.name;a.innerText="Télécharger";
a.style.color="white";d.appendChild(a);
}
if(isAdmin){
let b=document.createElement("button");
b.className="delete";b.innerText="X";
b.onclick=()=>{exercises.splice(i,1);save();loadExercises()};
d.appendChild(b);
}
box.appendChild(d);
});
}

function goBack(){
document.getElementById("subjects").style.display="none";
document.getElementById("exercises").style.display="none";
document.getElementById("classes").style.display="flex";
document.getElementById("backBtn").style.display="none";
}

adminIcon.onclick=()=>adminModal.style.display="flex";
closeAdmin.onclick=()=>adminModal.style.display="none";

function login(){
if(loginPass.value==adminPass){
isAdmin=true;adminPanel.style.display="block";
}else alert("Code faux");
}

function changePass(){
adminPass=newPass.value;
localStorage.setItem("ds_pass",adminPass);
alert("Code changé");
}

function addExercise(){
let f=aFile.files[0];
if(!f||!aTitle.value)return alert("Manque info");
let r=new FileReader();
r.onload=()=>{
exercises.push({
c:aClass.value,s:aSubject.value,t:aTitle.value,
data:r.result,name:f.name,type:f.type.startsWith("image")?"img":"doc"
});
save();alert("Ajouté");
};
r.readAsDataURL(f);
}

function loadAdminMenus(){
for(let c in classes){
let o=document.createElement("option");
o.value=c;o.innerText=c;aClass.appendChild(o);
}
aClass.onchange=()=>{
aSubject.innerHTML="";
classes[aClass.value].forEach(s=>{
let o=document.createElement("option");
o.value=s;o.innerText=s;aSubject.appendChild(o);
});
};
aClass.onchange();
}

loadClasses();
loadAdminMenus();
</script>

</body>
</html>
